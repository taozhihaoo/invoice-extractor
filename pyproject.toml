[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "0.2.0"
description = "Invoice extraction service: PDF ingestion, text extraction, classification, LLM structured extraction, deterministic validation, SQLite persistence and CSV/JSON export. Unverifiable results are flagged for review, never silently accepted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Invoice Extractor contributors" }]
keywords = ["invoice-extraction", "document-processing", "ocr", "llm", "fastapi", "structured-extraction"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
invoice-extractor = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's declared pattern for upload parameters (`= File(...)`).
"src/api/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "optional_ocr: integration tests that require a real Tesseract installation (skipped automatically when absent)",
]
