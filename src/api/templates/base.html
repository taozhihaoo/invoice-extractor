<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Document Processor{% endblock %}</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --ink:#1a202c; --muted:#64748b; --accent:#2563eb;
        --border:#e2e8f0; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg); color:var(--ink); }
header { background:#111827; color:#fff; padding:14px 24px; display:flex;
         align-items:center; gap:24px; }
header a { color:#cbd5e1; text-decoration:none; font-size:14px; }
header a:hover { color:#fff; }
header .brand { font-weight:700; font-size:16px; color:#fff; margin-right:12px; }
main { max-width:1000px; margin:24px auto; padding:0 16px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px;
        padding:20px; margin-bottom:20px; }
h1 { font-size:22px; margin:0 0 16px; }
h2 { font-size:16px; margin:0 0 12px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase;
     letter-spacing:.04em; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
.badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px;
         font-weight:600; }
.badge.processed { background:#dcfce7; color:#166534; }
.badge.needs_review { background:#fef3c7; color:#92400e; }
.badge.failed { background:#fee2e2; color:#991b1b; }
.badge.neutral { background:#e2e8f0; color:#334155; }
.stat { font-size:28px; font-weight:700; }
.muted { color:var(--muted); font-size:13px; }
.mono { font-family:ui-monospace,Consolas,monospace; font-size:13px; }
dl { display:grid; grid-template-columns:200px 1fr; row-gap:6px; margin:0; font-size:14px; }
dt { color:var(--muted); }
dd { margin:0; }
.warning { background:#fffbeb; border:1px solid #fde68a; border-radius:8px;
           padding:10px 14px; margin:6px 0; font-size:14px; }
.banner { border-radius:8px; padding:12px 16px; margin:0 0 16px; font-weight:600; }
.banner.review { background:#fef3c7; color:#92400e; border:1px solid #f59e0b; }
.banner.fail { background:#fee2e2; color:#991b1b; border:1px solid #ef4444; }
.banner.ok { background:#dcfce7; color:#166534; border:1px solid #22c55e; }
input[type=file] { margin:8px 0 16px; display:block; }
button { background:var(--accent); color:#fff; border:0; border-radius:8px;
         padding:10px 18px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <span class="brand">AI Document Processor</span>
  <a href="/">Dashboard</a>
  <a href="/upload">Upload</a>
  <a href="/docs">API Docs</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
