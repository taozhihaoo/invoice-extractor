<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}{{ t("brand") }}{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
          <path d="M14 3v5h5M9 13h6M9 17h4"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>{{ t("brand") }}</strong>
        <small>{{ t("brand.tag") }}</small>
      </span>
    </a>

    <nav class="nav">
      <a href="/"{% if active == "dashboard" %} class="active" aria-current="page"{% endif %}>{{ t("nav.dashboard") }}</a>
      <a href="/upload"{% if active == "upload" %} class="active" aria-current="page"{% endif %}>{{ t("nav.upload") }}</a>
      <a href="/docs" target="_blank" rel="noopener">{{ t("nav.api") }}</a>
    </nav>

    <div class="lang" role="group" aria-label="Language">
      {% for item in languages %}
      <a href="{{ request.url.path }}?lang={{ item.code }}"
         {% if item.active %}class="on" aria-current="true"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </div>
  </div>
</header>

<main class="wrap main">
{% block content %}{% endblock %}
</main>

<footer class="wrap footer">
  <span>{{ t("footer.note") }}</span>
  <span class="mono">v{{ version }}</span>
</footer>
</body>
</html>
